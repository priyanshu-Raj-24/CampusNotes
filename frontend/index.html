<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusNotes - The Shared Academic Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F8F8F5] text-[#202522] font-manrope min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-[#E5E7E2] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showSection('home')">
                <div class="w-8 h-8 bg-[#285744] rounded text-white flex items-center justify-center font-bold text-xl">C</div>
                <span class="font-bold text-xl tracking-tight">CampusNotes</span>
            </div>
            <nav class="hidden md:flex gap-6">
                <a href="#" class="text-[#747A76] hover:text-[#285744] font-medium" onclick="showSection('home')">Browse</a>
                <a href="#" class="text-[#747A76] hover:text-[#285744] font-medium">Recent</a>
            </nav>
            <div>
                <button onclick="showSection('upload')" class="bg-[#285744] hover:bg-[#1e4233] text-white px-5 py-2 rounded-md font-medium transition-colors">
                    Upload Notes
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        
        <!-- Home Section -->
        <section id="home-section" class="block">
            <div class="text-center max-w-3xl mx-auto mb-16">
                <h1 class="text-4xl md:text-5xl font-bold mb-4 text-[#202522]">Your Campus. Your Notes. <br>One Shared Library.</h1>
                <p class="text-lg text-[#747A76]">Discover lecture notes, previous-year papers, lab manuals, and academic resources organized by semester.</p>
            </div>
            
            <h2 class="text-2xl font-bold mb-6">Recently Published</h2>
            <div id="resources-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Resources injected via JS -->
                <div class="col-span-full text-center py-10 text-[#747A76]" id="loading-indicator">
                    Loading resources...
                </div>
            </div>
        </section>

        <!-- Upload Section -->
        <section id="upload-section" class="hidden max-w-2xl mx-auto bg-white p-8 rounded-xl border border-[#E5E7E2] shadow-sm">
            <h2 class="text-2xl font-bold mb-6">Upload Academic Resource</h2>
            <form id="upload-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium mb-1">Resource Title</label>
                    <input type="text" id="title" required class="w-full border border-[#E5E7E2] rounded-md px-4 py-2 focus:outline-none focus:border-[#285744]">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Academic Year</label>
                        <select id="academicYear" class="w-full border border-[#E5E7E2] rounded-md px-4 py-2 bg-white">
                            <option value="1">Year 1</option>
                            <option value="2">Year 2</option>
                            <option value="3">Year 3</option>
                            <option value="4">Year 4</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Semester</label>
                        <select id="semester" class="w-full border border-[#E5E7E2] rounded-md px-4 py-2 bg-white">
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Subject</label>
                        <input type="text" id="subject" required placeholder="e.g. Data Structures" class="w-full border border-[#E5E7E2] rounded-md px-4 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Category</label>
                        <select id="category" class="w-full border border-[#E5E7E2] rounded-md px-4 py-2 bg-white">
                            <option value="Lecture Notes">Lecture Notes</option>
                            <option value="Previous Year Question Papers">Question Papers</option>
                            <option value="Lab Manuals">Lab Manuals</option>
                            <option value="Reference Materials">Reference Materials</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Document File</label>
                    <input type="file" id="file" required accept=".pdf,.doc,.docx,.txt,.png,.jpg" class="w-full border border-[#E5E7E2] rounded-md px-4 py-2 bg-[#F8F8F5]">
                    <p class="text-xs text-[#747A76] mt-1">Max size: 10MB. Supported: PDF, DOCX, TXT, Images.</p>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-[#285744] hover:bg-[#1e4233] text-white px-5 py-3 rounded-md font-medium transition-colors mt-4">
                    Upload & Publish
                </button>
                <div id="upload-status" class="hidden text-sm font-medium text-center mt-3"></div>
            </form>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
